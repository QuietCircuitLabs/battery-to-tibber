<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery to Tibber</title><script src="/homey.js" data-origin="settings"></script><script src="./locale.js"></script><script src="./setup.js"></script><link rel="stylesheet" href="./instrument.css"></head><body><main>
<header class="app-header"><div class="brand">BATTERY <span>→</span> TIBBER</div><div class="build">HOMEY PRO<br>COMMUNITY BETA</div></header>
<p id="live" role="status" aria-live="polite"></p>
<section id="add" class="card" hidden><h2 data-sv="Lägg till Tibber-uppdatering" data-en="Add Tibber updates"></h2><p data-sv="Öppna Enheter → Lägg till → Battery to Tibber. Kom tillbaka när enheten är tillagd." data-en="Open Devices → Add → Battery to Tibber. Return after adding the device."></p><button id="reload" data-sv="Kontrollera igen" data-en="Check again"></button></section>
<section id="dashboard" class="card" hidden><h2 data-sv="Dina batteriuppdateringar" data-en="Your battery updates"></h2><p id="current-state"></p><div class="metrics" id="metrics"></div><p id="next-write"></p><div class="row"><button id="sync" data-sv="Kontrollera nu" data-en="Check now"></button><button id="pause" class="secondary" data-sv="Pausa" data-en="Pause"></button><button id="resume" data-sv="Återuppta" data-en="Resume"></button><button id="edit" class="text" data-sv="Ändra inställningar" data-en="Change settings"></button></div></section>
<div id="wizard" hidden><div class="steps"><span id="step-number"></span><span>BATTERY TO TIBBER</span></div><div class="progress"><span id="progress"></span></div>
<section id="step-1" class="card"><h2 data-sv="Var finns batterinivån?" data-en="Where is the battery level?"></h2><p data-sv="Använd bilens app i Homey, eller låt ett Flow lämna batteriprocenten. Ingen särskild biltillverkare krävs." data-en="Use your car's app in Homey, or supply battery percentages through Flow. No particular car brand is required."></p>
<label for="source" data-sv="Datakälla" data-en="Data source"></label><select id="source"><option value="device" data-sv="En enhet i Homey" data-en="A device in Homey"></option><option value="flow" data-sv="Batterivärde från Flow" data-en="Battery value from Flow"></option></select>
<div id="device-options"><label for="car" data-sv="Bilens enhet" data-en="Vehicle device"></label><select id="car"></select><small data-sv="Listan innehåller enheter som rapporterar batteriprocent. Bekräfta att du väljer bilen, inte en sensor eller fjärrkontroll." data-en="The list includes devices reporting battery percentages. Confirm that you select your car, not a sensor or remote control."></small><label for="battery" data-sv="Batterivärde" data-en="Battery reading"></label><select id="battery"></select><p id="reading"></p><label class="check"><input type="checkbox" id="confirm-car"><span data-sv="Jag bekräftar att detta är bilens batterinivå." data-en="I confirm this is my vehicle's battery level."></span></label>
<label for="target-mode" data-sv="Anpassa för AC-laddgräns (valfritt)" data-en="Adjust for AC charge limit (optional)"></label><select id="target-mode"><option value="none" data-sv="Nej – skicka verklig batteriprocent" data-en="No – send the actual battery percentage"></option><option value="device" data-sv="Läs laddgränsen från bilens enhet" data-en="Read the charge limit from the car device"></option><option value="fixed" data-sv="Jag anger laddgränsen" data-en="I will enter the charge limit"></option></select><select id="target-cap" aria-label="AC charge limit reading" hidden></select><input id="fixed-target" type="number" min="50" max="100" step="1" value="80" aria-label="AC charge limit percent" hidden><small data-sv="Med gräns 80 % och batteri 60 % skickas 80 % till Tibber. Vid gräns 100 % skickas verklig procent. Det anpassade värdet används bara för laddplanering." data-en="With an 80% limit and a 60% battery, Tibber receives 80%. At a 100% limit the actual percentage is sent. The adjusted value is only for charging planning."></small></div>
<div id="flow-info" hidden><p data-sv="Efter installationen använder du kortet Ange batterinivå från Flow. Laddgräns behövs inte. Det befintliga kortet med både batteri och laddgräns finns också kvar. Varje körning ska lämna ett aktuellt värde. Flow-läget gör ingen automatisk plats- eller inkopplingskontroll." data-en="After setup, use the Provide battery level from Flow card. No charge limit is needed. The existing card for both battery and charge limit is also retained. Each run must supply a current reading. Flow mode does not automatically check location or cable connections."></p></div></section>
<section id="step-2" class="card" hidden><h2 data-sv="När får Tibber uppdateras?" data-en="When may Tibber be updated?"></h2><p data-sv="Standard: både bilen och hemmaladdaren rapporterar inkopplad. GPS behövs inte. Två samtidiga anslutningar bevisar inte att det är samma bil; en bil på jobbet och en annan hemma kan uppfylla kontrollen." data-en="Default: both the vehicle and the home charger report plugged in. GPS is not required. Two simultaneous connections do not prove it is the same car; a car at work and another at home can satisfy this check."></p>
<label for="connection" data-sv="Inkopplingskontroll" data-en="Connection check"></label><select id="connection"><option value="device" data-sv="Bil och hemmaladdare i Homey" data-en="Vehicle and home charger in Homey"></option><option value="external" data-sv="Bil i Homey + laddarsignal via Flow" data-en="Vehicle in Homey + charger signal via Flow"></option><option value="none" data-sv="Ingen inkopplingskontroll" data-en="No connection check"></option></select><div id="car-plug"><label for="car-connection" data-sv="Bilens inkopplingssignal" data-en="Vehicle plugged-in signal"></label><select id="car-connection"></select></div><div id="charger-choice"><label for="charger" data-sv="Hemmaladdarens inkopplingssignal" data-en="Home charger plugged-in signal"></label><select id="charger"></select></div><p id="external-note" hidden data-sv="Låt ett Flow lämna aktuell anslutningsstatus minst var 15:e minut och direkt vid urkoppling. Efter omstart krävs en ny signal." data-en="Have a Flow supply current connection status at least every 15 minutes and immediately on disconnect. A new signal is required after restart."></p><label class="check" id="none-warning" hidden><input id="confirm-none" type="checkbox"><span data-sv="Jag förstår att Tibber kan uppdateras även när bilen inte är ansluten hemma." data-en="I understand Tibber may be updated even when the car is not plugged in at home."></span></label>
<label class="check"><input id="home-check" type="checkbox"><span data-sv="Använd även bilens position inom 100 meter från hemmet (valfritt)." data-en="Also require the car to be within 100 metres of home (optional)."></span></label><div id="home-options" hidden><p data-sv="Adressökning skickar adressen eller Homeys hemposition till Photon hos Komoot. Inga Tibber-uppgifter skickas dit." data-en="Address lookup sends the address or Homey's home position to Photon at Komoot. No Tibber credentials are sent there."></p><input id="address-query" type="text" aria-label="Home address"><div class="row"><button id="search-address" type="button" data-sv="Sök adress" data-en="Search address"></button><button id="home-address" type="button" class="secondary" data-sv="Använd Homeys hemposition" data-en="Use Homey's home position"></button></div><select id="home-choice" aria-label="Home address results"></select><label class="check"><input type="checkbox" id="home-confirm"><span data-sv="Jag bekräftar hemadressen." data-en="I confirm the home address."></span></label></div>
<details><summary data-sv="Färskhet och uppdatering av bilappen" data-en="Freshness and refreshing the car app"></summary><p data-sv="Appen läser Homeys befintliga värden varje minut. Det kontaktar inte bilen. För andra bilappar än den verifierade Kia-integrationen används batterivärdets tidsstämpel försiktigt: en gammal tidsstämpel kan betyda att värdet är oförändrat, men räknas ändå som gammalt här." data-en="The app reads existing Homey values every minute. This does not contact the car. Outside the verified Kia integration, battery timestamps are treated conservatively: an old timestamp may mean the value is unchanged, but is still treated as old here."></p><label for="max-age" data-sv="Högsta dataålder (minuter)" data-en="Maximum data age (minutes)"></label><input id="max-age" type="number" min="5" max="120" value="30"><label for="refresh" data-sv="Begär nya uppgifter från bilappen" data-en="Request fresh data from the car app"></label><select id="refresh"><option value="off" data-sv="Av – bilappen sköter sina egna uppdateringar" data-en="Off – let the car app manage its updates"></option><option value="kia" data-sv="Verifierad Kia-statusfråga (om tillgänglig)" data-en="Verified Kia status request (when available)"></option><option value="flow" data-sv="Via Flow – koppla till bilappens uppdateringskort" data-en="Via Flow – connect to the car app's refresh action"></option></select><label for="refresh-interval" data-sv="Minsta intervall mellan förfrågningar" data-en="Minimum interval between requests"></label><select id="refresh-interval"><option value="30">30 min</option><option value="60" selected>60 min</option><option value="120">120 min</option><option value="360">360 min</option></select><small data-sv="Aktiv uppdatering kan anropa biltillverkarens API. Använd bara intervall som bilappen tillåter. Kia-frågor kräver också att bilens rapporterade 12 V-nivå är över dess larmgräns. Uppdatering sker bara när automatiken är aktiv och laddarsignalen tillåter det, eller när du uttryckligen valt bort inkopplingskontroll." data-en="Active refresh may call the manufacturer's API. Use only intervals permitted by the car app. Kia requests also require the reported 12V level to exceed its alarm threshold. Requests run only while automation is enabled and the charger signal allows it, or when you explicitly disable connection checks."></small></details></section>
<section id="step-3" class="card" hidden><h2 data-sv="Anslut Tibber" data-en="Connect Tibber"></h2><label for="email" data-sv="E-post till Tibber" data-en="Tibber email"></label><input type="email" id="email" autocomplete="username"><label for="password" data-sv="Lösenord" data-en="Password"></label><input id="password" type="password" autocomplete="current-password"><label class="check"><input id="remember" type="checkbox"><span data-sv="Spara inloggningen lokalt på Homey för automatisk återanslutning." data-en="Save sign-in details locally on Homey for automatic reconnection."></span></label><small data-sv="Lösenord och session sparas i appens interna lagring, inte i källkod eller loggar. Utgivaren får dem inte. Kopplingen är inofficiell och kan påverkas av ändringar hos Tibber." data-en="Password and session are saved in internal app storage, not in source or logs. The developer does not receive them. This unofficial connection may be affected by Tibber changes."></small><div class="row"><button id="login" data-sv="Logga in" data-en="Sign in"></button><button id="load-vehicles" class="secondary" data-sv="Hämta mina bilar" data-en="Load my vehicles"></button></div><label for="vehicle" data-sv="Vilken manuellt tillagd bil i Tibber?" data-en="Which manually added vehicle in Tibber?"></label><select id="vehicle"></select><label class="check"><input type="checkbox" id="offline"><span data-sv="Detta är bilen där jag själv kan ange batteriprocent i Tibber." data-en="This is the vehicle where I can manually enter a battery percentage in Tibber."></span></label></section>
<section id="step-4" class="card" hidden><h2 data-sv="Kontrollera och testa" data-en="Review and test"></h2><p id="review"></p><p data-sv="Öppna den valda bilen i Tibber. Ange procenten som redan visas. Vi skriver samma värde, så testet inte ändrar laddplaneringen." data-en="Open the selected vehicle in Tibber. Enter the percentage already displayed. We write back the same value so the test does not change the charging plan."></p><label for="existing" data-sv="Nuvarande procent i Tibber" data-en="Current percentage in Tibber"></label><input id="existing" type="number" min="0" max="100" step="1"><label class="check"><input id="same" type="checkbox"><span data-sv="Jag har kontrollerat värdet i Tibber." data-en="I have checked the value in Tibber."></span></label><button id="test" data-sv="Testa med samma procent" data-en="Test with the same percentage"></button><label class="check"><input id="verified" type="checkbox"><span data-sv="Tibber visar rätt procent efter testet. Jag vill aktivera automatiken." data-en="Tibber displays the correct percentage after the test. I want to enable automation."></span></label><button id="enable" data-sv="Aktivera automatiska uppdateringar" data-en="Enable automatic updates"></button><small data-sv="Appen skriver högst en gång per 15 minuter. Ett test kan därför skjuta upp första automatiska skrivningen. Oförändrade värden skrivs inte igen. Tibber behåller laddstyrningen." data-en="The app writes at most once every 15 minutes. A test can therefore delay the first automatic write. Unchanged values are not written again. Tibber retains charging control."></small></section>
<div class="actions"><button id="back" class="secondary" data-sv="Tillbaka" data-en="Back"></button><button id="next" data-sv="Fortsätt" data-en="Continue"></button></div></div>
<details><summary data-sv="Uppgifter och integritet" data-en="Data and privacy"></summary><p data-sv="Full åtkomst till Homey används för att hitta och läsa den bil och laddare du väljer samt, om valt, begära status från Kia-appen. Platsbehörigheten används bara för frivillig hemkontroll och adressval. Ingen laddare startas eller stoppas. Tibber får bara batterivärdet för vald bil. Utgivaren får inte lösenord, positioner eller automatisk telemetri." data-en="Full Homey access discovers and reads your selected vehicle and charger and, if selected, requests Kia status. Location permission is used only for optional home checks and address selection. No charger is started or stopped. Tibber receives only the battery value for your selected vehicle. The developer receives no passwords, locations or automatic telemetry."></p><button id="logout" class="text" data-sv="Logga ut och radera sparad inloggning" data-en="Sign out and delete saved credentials"></button></details><p><a href="https://github.com/QuietCircuitLabs/battery-to-tibber/issues" target="_blank" rel="noopener noreferrer">Support and questions</a> · <a href="https://github.com/QuietCircuitLabs/battery-to-tibber" target="_blank" rel="noopener noreferrer">User guide</a></p><footer data-sv="Testat med Kia EV9 och Zaptec. Andra integrationer behöver verifieras med sina användare." data-en="Tested with Kia EV9 and Zaptec. Other integrations need verification with their users."></footer></main><script>function onHomeyReady(Homey){BatterySetup.start(Homey);}</script></body></html>
